name: Build

env:
  GO_VERSION: 1.25

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run checks
        run: |
          make checks

  unitTest:
    name: Unit test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Setup Go 1.25
        uses: actions/setup-go@v6.0.0
        with:
          go-version: 1.25
        id: go

      - uses: actions/checkout@v5.0.0

      - name: Run unit test
        timeout-minutes: 15
        run: make unit-test
        env:
          CODECOV_UPLOAD_TOKEN: ${{ secrets.CODECOV_UPLOAD_TOKEN }}

      - name: Upload coverage to Codecov
        timeout-minutes: 10
        if: matrix.os == 'ubuntu-latest' && github.repository == 'trustbloc/sidetree-core-go'
        uses: codecov/codecov-action@v5.5.1
        with:
          file: ./coverage.txt
